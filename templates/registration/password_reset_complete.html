{% extends 'base_login.html' %}
{% load static %}

{% block title %}Contraseña Actualizada{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-4">
            <i class="fas fa-check-circle text-green-600 text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-3">Contraseña actualizada</h2>
        <p class="text-gray-600 text-sm mb-6">Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a href="{% url 'core:login' %}"
           class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md w-full transition duration-300 ease-in-out">
            Iniciar sesión
        </a>
    </div>
</div>
{% endblock %}
