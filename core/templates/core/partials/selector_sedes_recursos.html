{# Estilos y comportamiento de selector_sedes.html (se incluye una sola vez por página) #}
<style>
    .sedes-multi { position: relative; min-width: 220px; text-align: left; }
    .sedes-multi > summary { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; list-style: none; cursor: pointer; padding: 0.45rem 0.75rem; border: 1px solid var(--border-color); border-radius: 0.4rem; background: var(--bg-card); color: var(--text-primary); font-size: 0.9rem; }
    .sedes-multi > summary::-webkit-details-marker { display: none; }
    .sedes-multi > summary i { font-size: 0.7rem; color: var(--text-muted); }
    .sedes-multi-panel { position: absolute; z-index: 50; top: calc(100% + 4px); left: 0; min-width: 100%; width: max-content; max-width: 85vw; max-height: 320px; overflow-y: auto; padding: 0.6rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.5rem; box-shadow: var(--shadow-lg); }
    .sedes-multi-panel label { display: flex; align-items: center; gap: 0.55rem; padding: 0.4rem 0.5rem; border-radius: 0.35rem; cursor: pointer; color: var(--text-primary); font-size: 0.9rem; font-weight: 400; }
    .sedes-multi-panel label:hover { background: var(--bg-tertiary); }
    .sedes-multi-panel input { accent-color: var(--accent-primary); width: 1rem; height: 1rem; flex: none; }
    .sedes-multi-botones { display: flex; gap: 0.5rem; padding-bottom: 0.5rem; margin-bottom: 0.3rem; border-bottom: 1px solid var(--border-color); }
    .sedes-multi-botones button { border: 1px solid var(--accent-primary); color: var(--accent-primary); background: transparent; border-radius: 0.35rem; padding: 0.15rem 0.7rem; font-size: 0.8rem; font-weight: 600; }
    .sedes-multi-botones button:hover { background: var(--accent-subtle); }
</style>
<script nonce="{{ csp_nonce }}">
    document.addEventListener('DOMContentLoaded', function () {
        const cajas = Array.from(document.querySelectorAll('.sedes-multi'));

        function actualizar(caja) {
            const todas = Array.from(caja.querySelectorAll('input[name="sede"]'));
            const marcadas = todas.filter(c => c.checked);
            let texto = marcadas.length + ' de ' + todas.length + ' sedes';
            if (marcadas.length === todas.length) texto = 'Todas las sedes (' + todas.length + ')';
            else if (marcadas.length === 1) texto = marcadas[0].parentElement.querySelector('span').textContent;
            else if (marcadas.length === 0) texto = 'Elige al menos una sede';
            caja.querySelector('.sedes-multi-texto').textContent = texto;
        }

        cajas.forEach(function (caja) {
            caja.addEventListener('change', () => actualizar(caja));
            caja.querySelectorAll('button[data-marcar]').forEach(function (boton) {
                boton.addEventListener('click', function () {
                    caja.querySelectorAll('input[name="sede"]').forEach(c => { c.checked = boton.dataset.marcar === '1'; });
                    actualizar(caja);
                });
            });
            // Sin ninguna marcada no se envía: si no, parecería que se filtró y saldría otra cosa.
            const formulario = caja.closest('form');
            if (formulario) formulario.addEventListener('submit', function (evento) {
                if (caja.hidden) return;
                if (!caja.querySelector('input[name="sede"]:checked')) {
                    evento.preventDefault();
                    caja.open = true;
                }
            });
            actualizar(caja);
        });

        // Superusuario: solo se usan las casillas del grupo elegido en el selector de empresa.
        document.querySelectorAll('select[data-controla-sedes]').forEach(function (selector) {
            const formulario = selector.closest('form');
            function mostrar() {
                formulario.querySelectorAll('.sedes-multi[data-grupo]').forEach(function (caja) {
                    const visible = caja.dataset.grupo === selector.value;
                    caja.hidden = !visible;
                    caja.querySelectorAll('input[name="sede"]').forEach(c => { c.disabled = !visible; });
                });
            }
            selector.addEventListener('change', mostrar);
            mostrar();
        });

        document.addEventListener('click', function (evento) {
            cajas.forEach(caja => { if (!caja.contains(evento.target)) caja.open = false; });
        });
    });
</script>
