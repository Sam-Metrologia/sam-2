{% extends 'base.html' %}
{% load static custom_filters %}

{% block extra_head %}
<style>
    .terminos-container {
        max-width: 480px;
        margin: 4rem auto;
        padding: 0 1rem;
        text-align: center;
    }

    .terminos-container p {
        color: #4a5568;
        margin-bottom: 1.5rem;
    }

    .terminos-container p a {
        color: #3182ce;
        font-weight: 600;
    }

    .checkbox-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
    }

    .checkbox-container input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .checkbox-container label {
        font-size: 0.95rem;
        cursor: pointer;
    }

    .btn-container {
        display: flex;
        justify-content: center;
        gap: 1rem;
    }

    .btn-accept {
        background-color: #48bb78;
        color: white;
        padding: 0.5rem 1.5rem;
        font-size: 0.95rem;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
    }

    .btn-accept:disabled {
        background-color: #cbd5e0;
        cursor: not-allowed;
    }

    .btn-reject {
        background: none;
        color: #a0aec0;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        border: none;
        cursor: pointer;
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="terminos-container">
    <p>
        Para continuar debes aceptar los
        <a href="{% url 'core:ver_terminos_html' %}" target="_blank" rel="noopener">términos y condiciones</a>
        de uso de SAM Metrología.
    </p>

    <form method="post" id="formTerminos">
        {% csrf_token %}

        <div class="checkbox-container">
            <input type="checkbox" id="acepta_terminos" name="acepta_terminos" required>
            <label for="acepta_terminos">Acepto los términos y condiciones</label>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-accept" id="btnAceptar" disabled>Aceptar</button>
        </div>
    </form>

    <form method="post" action="{% url 'core:rechazar_terminos' %}" id="formRechazar" style="display: none;">
        {% csrf_token %}
    </form>

    <button type="button" class="btn-reject" onclick="confirmarRechazo()">No acepto, cerrar sesión</button>
</div>

<script nonce="{{ csp_nonce }}">
    document.getElementById('acepta_terminos').addEventListener('change', function() {
        document.getElementById('btnAceptar').disabled = !this.checked;
    });

    function confirmarRechazo() {
        if (confirm('¿Estás seguro de que deseas rechazar los términos? Se cerrará tu sesión y no podrás usar SAM Metrología.')) {
            document.getElementById('formRechazar').submit();
        }
    }

    document.getElementById('formTerminos').addEventListener('submit', function(e) {
        if (!document.getElementById('acepta_terminos').checked) {
            e.preventDefault();
            alert('Debes aceptar los términos y condiciones para continuar.');
        }
    });
</script>
{% endblock %}
