# render.yaml - Configuración de Render para SAM Metrología
# https://render.com/docs/blueprint-spec

services:
  # Servicio Web Principal
  - type: web
    name: sam-metrologia
    runtime: python
    plan: free  # Plan gestionado manualmente en el dashboard de Render
    region: oregon  # Región más cercana: ohio, oregon, frankfurt, singapore

    buildCommand: "./build.sh"
    startCommand: "./start.sh"

    # Archivos a incluir en el build
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: sam-metrologia-db
          property: connectionString

      - key: AWS_ACCESS_KEY_ID
        sync: false  # Debes configurarlo manualmente en Render Dashboard

      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Debes configurarlo manualmente en Render Dashboard

      - key: AWS_STORAGE_BUCKET_NAME
        sync: false  # Debes configurarlo manualmente en Render Dashboard

      - key: AWS_S3_REGION_NAME
        value: us-east-2  # Cambia según tu región de S3

      - key: DEBUG_VALUE
        value: False

      - key: RENDER_EXTERNAL_HOSTNAME
        value: sam-9o6o.onrender.com  # Cambia por tu dominio de Render

      # Configuraciones opcionales de email
      - key: EMAIL_HOST
        value: smtp.gmail.com
        sync: false

      - key: EMAIL_PORT
        value: 587

      - key: EMAIL_HOST_USER
        sync: false  # Configurar manualmente

      - key: EMAIL_HOST_PASSWORD
        sync: false  # Configurar manualmente

      - key: ADMIN_EMAIL
        value: metrologiasam@gmail.com

    # Health check endpoint
    healthCheckPath: /

    # Auto-deploy desde GitHub
    autoDeploy: true

    # Configuración de disco persistente (opcional para logs)
    disk:
      name: sam-logs
      mountPath: /opt/render/project/src/logs
      sizeGB: 1

  # Procesador de Cola ZIP (Background Worker)
  - type: worker
    name: sam-zip-processor
    runtime: python
    plan: free
    region: oregon

    buildCommand: "./build.sh"
    startCommand: "python manage.py process_zip_queue --check-interval 5 --cleanup-old"

    # Compartir variables de entorno con el servicio web
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SECRET_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: sam-metrologia-db
          property: connectionString

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

      - key: AWS_S3_REGION_NAME
        value: us-east-2

      - key: DEBUG_VALUE
        value: False

      - key: RENDER_EXTERNAL_HOSTNAME
        value: sam-9o6o.onrender.com

    # Auto-deploy desde GitHub
    autoDeploy: true

# Base de datos PostgreSQL
databases:
  - name: sam-metrologia-db
    databaseName: sam_db
    user: sam_user
    plan: free  # Puedes cambiar a: starter, standard, pro
    region: oregon  # Misma región que el servicio web
    ipAllowList: []  # Vacío = permite desde cualquier IP (Render managed)

# ===============================================================
# TAREAS AUTOMÁTICAS (cron)
# ===============================================================
# Este blueprint nunca se desplegó con una sección `cronJobs` real activa
# en Render (verificado 2026-09-14: la cuenta solo tiene el web service
# "SAM", ningún Cron Job). Las tareas programadas del sistema corren todas
# vía GitHub Actions (ver .github/workflows/), que llaman a endpoints en
# core/views/scheduled_tasks_api.py protegidos con SCHEDULED_TASKS_TOKEN:
#   - daily-notifications.yml              → alerta "vence hoy"
#   - weekly-upcoming-notifications.yml     → recordatorio semanal (martes)
#   - biweekly-upcoming-notifications.yml   → recordatorio quincenal (día 15)
#   - monthly-ahead-notifications.yml       → planeación mensual (día 1)
#   - weekly-overdue.yml                    → vencidas semanales (lunes)
#   - daily-maintenance.yml, cleanup-zips.yml, check-trials.yml,
#     cleanup-notifications.yml, cobrar-renovaciones.yml
#
# Pendiente sin cubrir por ningún lado (ni aquí ni en GitHub Actions):
# recalcular_stats_empresas, que refresca los contadores de "vencidas hoy"
# del dashboard con solo el paso del tiempo (sin que cambie ningún dato).
